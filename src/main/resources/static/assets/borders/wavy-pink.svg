<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --wavy-pink-1: #FF80BF;
        --wavy-pink-2: #FF4D94;
        --wavy-pink-3: #FFD1E8;
      }
      .wave-outer { stroke: var(--border-primary, var(--wavy-pink-2)); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .wave-inner { stroke: var(--border-secondary, var(--wavy-pink-1)); stroke-width: 2; stroke-dasharray: 8 6; stroke-linecap: round; fill: none; }
      .wave-accent { fill: var(--border-accent, var(--wavy-pink-3)); opacity: 0.7; }
    </style>
  </defs>

  <!-- Corner accent soft clouds -->
  <path class="wave-accent" d="M25 25 Q 50 15 70 30 Q 90 20 100 45 Q 85 70 60 65 Q 35 75 25 50 Z" />
  <path class="wave-accent" d="M575 25 Q 550 15 530 30 Q 510 20 500 45 Q 515 70 540 65 Q 565 75 575 50 Z" />
  <path class="wave-accent" d="M25 775 Q 50 785 70 770 Q 90 780 100 755 Q 85 730 60 735 Q 35 725 25 750 Z" />
  <path class="wave-accent" d="M575 775 Q 550 785 530 770 Q 510 780 500 755 Q 515 730 540 735 Q 565 725 575 750 Z" />

