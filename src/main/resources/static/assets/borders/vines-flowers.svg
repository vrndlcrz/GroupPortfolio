<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --vine-green: #10B981;
        --vine-dark: #047857;
        --flower-pink: #F43F5E;
        --flower-center: #FBBF24;
        --leaf-soft: #6EE7B7;
      }
      .vine-stem { stroke: var(--border-primary, var(--vine-dark)); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .vine-leaf { fill: var(--border-secondary, var(--leaf-soft)); stroke: var(--border-primary, var(--vine-dark)); stroke-width: 1.5; }
      .flower-petal { fill: var(--border-accent, var(--flower-pink)); opacity: 0.9; }
      .flower-core { fill: var(--flower-center); stroke: #D97706; stroke-width: 1.5; }
      .inner-vine-guide { stroke: var(--vine-green); stroke-width: 1.5; stroke-dasharray: 4 6; opacity: 0.6; fill: none; }
    </style>
  </defs>

  <!-- Inner rectangular border guide -->
  <rect class="inner-vine-guide" x="48" y="48" width="504" height="704" rx="16" />

  <!-- Continuous winding vine stem perimeter -->
  <path class="vine-stem" d="
    M 60 48
    C 110 38, 170 58, 230 46
    C 290 36, 350 56, 410 44
    C 470 34, 520 54, 552 60
    C 564 120, 544 180, 556 240
    C 566 300, 546 360, 554 420
    C 564 480, 542 540, 554 600
    C 564 660, 546 710, 540 752
    C 480 762, 420 742, 360 754
    C 300 764, 240 744, 180 756
    C 120 766, 70 746, 48 740
    C 36 680, 56 620, 44 560
    C 34 500, 54 440, 46 380
    C 36 320, 58 260, 46 200
    C 34 140, 54 90, 60 48 Z" />

  <!-- Corner Flowers (Top-Left) -->
  <g transform="translate(48, 48)">
    <circle class="flower-petal" cx="0" cy="-14" r="9" />
    <circle class="flower-petal" cx="14" cy="0" r="9" />
    <circle class="flower-petal" cx="0" cy="14" r="9" />
    <circle class="flower-petal" cx="-14" cy="0" r="9" />
    <circle class="flower-petal" cx="-10" cy="-10" r="8" />
    <circle class="flower-petal" cx="10" cy="-10" r="8" />
    <circle class="flower-petal" cx="-10" cy="10" r="8" />
    <circle class="flower-petal" cx="10" cy="10" r="8" />
    <circle class="flower-core" cx="0" cy="0" r="7" />
  </g>

  <!-- Corner Flowers (Top-Right) -->
  <g transform="translate(552, 48)">
    <circle class="flower-petal" cx="0" cy="-14" r="9" />
    <circle class="flower-petal" cx="14" cy="0" r="9" />
    <circle class="flower-petal" cx="0" cy="14" r="9" />
    <circle class="flower-petal" cx="-14" cy="0" r="9" />
    <circle class="flower-core" cx="0" cy="0" r="7" />
  </g>

  <!-- Corner Flowers (Bottom-Left) -->
  <g transform="translate(48, 752)">
    <circle class="flower-petal" cx="0" cy="-14" r="9" />
    <circle class="flower-petal" cx="14" cy="0" r="9" />
    <circle class="flower-petal" cx="0" cy="14" r="9" />
    <circle class="flower-petal" cx="-14" cy="0" r="9" />
    <circle class="flower-core" cx="0" cy="0" r="7" />
  </g>

  <!-- Corner Flowers (Bottom-Right) -->
  <g transform="translate(552, 752)">
    <circle class="flower-petal" cx="0" cy="-14" r="9" />
    <circle class="flower-petal" cx="14" cy="0" r="9" />
    <circle class="flower-petal" cx="0" cy="14" r="9" />
    <circle class="flower-petal" cx="-14" cy="0" r="9" />
    <circle class="flower-core" cx="0" cy="0" r="7" />
  </g>

  <!-- Midpoint Small Flowers -->
  <g transform="translate(300, 42)"><circle class="flower-petal" cx="0" cy="-8" r="6" /><circle class="flower-petal" cx="8" cy="0" r="6" /><circle class="flower-petal" cx="0" cy="8" r="6" /><circle class="flower-petal" cx="-8" cy="0" r="6" /><circle class="flower-core" cx="0" cy="0" r="4" /></g>
  <g transform="translate(300, 758)"><circle class="flower-petal" cx="0" cy="-8" r="6" /><circle class="flower-petal" cx="8" cy="0" r="6" /><circle class="flower-petal" cx="0" cy="8" r="6" /><circle class="flower-petal" cx="-8" cy="0" r="6" /><circle class="flower-core" cx="0" cy="0" r="4" /></g>
  <g transform="translate(42, 400)"><circle class="flower-petal" cx="0" cy="-8" r="6" /><circle class="flower-petal" cx="8" cy="0" r="6" /><circle class="flower-petal" cx="0" cy="8" r="6" /><circle class="flower-petal" cx="-8" cy="0" r="6" /><circle class="flower-core" cx="0" cy="0" r="4" /></g>
  <g transform="translate(558, 400)"><circle class="flower-petal" cx="0" cy="-8" r="6" /><circle class="flower-petal" cx="8" cy="0" r="6" /><circle class="flower-petal" cx="0" cy="8" r="6" /><circle class="flower-petal" cx="-8" cy="0" r="6" /><circle class="flower-core" cx="0" cy="0" r="4" /></g>

  <!-- Botanical Leaves sprout along edges -->
  <path class="vine-leaf" d="M140 45 C150 25, 175 30, 165 48 C155 58, 135 55, 140 45 Z" />
  <path class="vine-leaf" d="M220 50 C230 65, 255 60, 245 45 C235 35, 215 40, 220 50 Z" />
  <path class="vine-leaf" d="M380 46 C390 28, 415 32, 405 48 C395 58, 375 56, 380 46 Z" />
  <path class="vine-leaf" d="M460 52 C470 68, 495 62, 485 46 C475 36, 455 42, 460 52 Z" />

  <path class="vine-leaf" d="M555 140 C575 150, 570 175, 552 165 C542 155, 545 135, 555 140 Z" />
  <path class="vine-leaf" d="M550 290 C532 300, 538 325, 554 315 C564 305, 560 285, 550 290 Z" />
  <path class="vine-leaf" d="M556 490 C576 500, 572 525, 554 515 C544 505, 546 485, 556 490 Z" />
  <path class="vine-leaf" d="M548 650 C530 660, 536 685, 552 675 C562 665, 558 645, 548 650 Z" />

  <path class="vine-leaf" d="M140 755 C150 775, 175 770, 165 752 C155 742, 135 745, 140 755 Z" />
  <path class="vine-leaf" d="M220 750 C230 735, 255 740, 245 755 C235 765, 215 760, 220 750 Z" />
  <path class="vine-leaf" d="M380 754 C390 772, 415 768, 405 752 C395 742, 375 744, 380 754 Z" />
  <path class="vine-leaf" d="M460 748 C470 732, 495 738, 485 754 C475 764, 455 758, 460 748 Z" />

  <path class="vine-leaf" d="M45 150 C25 160, 30 185, 48 175 C58 165, 55 145, 45 150 Z" />
  <path class="vine-leaf" d="M50 300 C68 310, 62 335, 46 325 C36 315, 40 295, 50 300 Z" />
  <path class="vine-leaf" d="M44 500 C24 510, 28 535, 46 525 C56 515, 54 495, 44 500 Z" />
  <path class="vine-leaf" d="M52 660 C70 670, 64 695, 48 685 C38 675, 42 655, 52 660 Z" />
</svg>
