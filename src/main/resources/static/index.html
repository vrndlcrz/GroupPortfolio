<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A humorous 3D interactive portfolio website for Advanced Emerging Technologies featuring 5 member clear books on a messy student desk.">
  <meta name="author" content="AET Group 5">
  <title>The Messy Desk • AET 3D Group Portfolio</title>

  <!-- Typography: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Application Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/book.css">
</head>
<body>

  <!-- 1. REALISTIC EYE-BLINK LOADING SCREEN (3x Blink with Curved Eye Aperture) -->
  <div class="eye-blink-overlay" id="loadingScreen">
    <div class="eye-vignette"></div>
    <div class="eyelid-panel eyelid-top" id="eyelidTop">
      <svg viewBox="0 0 1000 500" preserveAspectRatio="none" class="eyelid-svg">
        <path d="M 0 0 L 1000 0 L 1000 500 C 750 435, 250 435, 0 500 Z" fill="#070A14" />
        <path d="M 0 500 C 250 435, 750 435, 1000 500" stroke="#020408" stroke-width="14" fill="none" opacity="0.9" />
      </svg>
    </div>
    <div class="eyelid-panel eyelid-bottom" id="eyelidBottom">
      <svg viewBox="0 0 1000 500" preserveAspectRatio="none" class="eyelid-svg">
        <path d="M 0 500 L 1000 500 L 1000 0 C 750 65, 250 65, 0 0 Z" fill="#070A14" />
        <path d="M 0 0 C 250 65, 750 65, 1000 0" stroke="#020408" stroke-width="10" fill="none" opacity="0.8" />
      </svg>
    </div>
  </div>

  <!-- 3. THREE.JS 3D SCENE CONTAINER -->
  <main id="scene-container" class="scene-waking-blur" aria-label="Interactive 3D Student Desk with 180 Degree Look Around"></main>

  <!-- 2. TOP NAVBAR (Floating on top of scene container with guaranteed clickability) -->
  <header class="top-navbar-dock" id="topNavbar">
    <div class="top-navbar-inner">
      <button class="hud-btn primary" id="openGuestbookNavBtn" title="Leave a sticky note on the desk">
        <svg class="uicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        <span class="hud-label">Leave Note</span>
      </button>
      <button class="hud-btn easter-egg-btn" id="easterEggBtn" title="Toggle Anti-Gravity Easter Egg (Press 'E')">
        <svg class="uicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        <span class="hud-label">Zero-G</span>
      </button>
      <button class="hud-btn" id="muteToggleBtn" title="Mute/Unmute sound effects">
        <svg class="uicon sound-icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
        <span class="hud-label">Sound</span>
      </button>
      <button class="hud-btn" id="termsBtn" title="Read humorous Terms & Conditions">
        <svg class="uicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        <span class="hud-label">Terms</span>
      </button>
    </div>
  </header>

  <!-- Bottom Center: 180° Look Around & Control Guide (Clean, non-intrusive) -->
  <aside class="floating-look-guide" id="lookGuide">
    <svg class="uicon guide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
    <span><strong>Free Look POV:</strong> Drag or move mouse to look up, down &amp; around • Press <span class="kbd-hint">E</span> for Zero-G • Click folders to open</span>
  </aside>

  <!-- Interactive 3D Tooltip -->
  <div class="desk-tooltip" id="deskTooltip"></div>

  <!-- 4. NOTE VIEWER MODAL (Cinematic Sticky Note Animation, like Clear-Book) -->
  <div class="note-view-modal-overlay" id="noteViewModal" role="dialog" aria-modal="true" aria-label="View Sticky Note">
    <div class="note-view-card" id="noteViewCard">
      <div class="note-pin-decor"></div>
      <button class="note-view-close-x" id="noteViewCloseBtn" title="Back to Desk (Esc)" aria-label="Close">✕</button>
      <div class="note-view-header">
        <span class="note-view-author-badge" id="noteViewAuthor">Visitor</span>
        <span class="note-view-subtitle" id="noteViewDedicated">Desk Guestbook Note</span>
      </div>
      <div class="note-view-body" id="noteViewBody">
        "Loading note message..."
      </div>
      <div class="note-view-footer">
        <span class="note-view-hint">Pinned directly onto the 3D desk</span>
        <button class="note-view-return-btn" id="noteViewReturnBtn">
          <svg class="uicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          Return to Desk
        </button>
      </div>
    </div>
  </div>

  <!-- 4. GUESTBOOK MODAL (Sticky Note Creator) -->
  <div class="guestbook-modal-overlay" id="guestbookModal" role="dialog" aria-modal="true" aria-label="Guestbook Modal">
    <div class="guestbook-card">
      <div class="guestbook-header">
        <div style="display:flex; align-items:center; gap:10px;">
          <svg class="uicon modal-title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
          <div>
            <h3 style="margin:0; font-size:1.15rem; font-weight:800;">Leave a Sticky Note</h3>
            <p style="font-size:0.8rem; color:#4B5563; margin-top:2px;">Your message will land directly on the 3D desk!</p>
          </div>
        </div>
        <button class="guestbook-close-x" id="guestbookCloseBtn" title="Close" aria-label="Close">✕</button>
      </div>

      <form class="guestbook-form" id="guestbookForm">
        <div>
          <label class="guestbook-field-label" for="memberSelectDropdown">Dedicate to Member:</label>
          <select class="guestbook-input" id="memberSelectDropdown" style="margin-top:4px;">
            <option value="1">1. Joshua Deliva</option>
            <option value="2">2. Maria Santos</option>
            <option value="3">3. Kenji Sato</option>
            <option value="4">4. Sophia Reyes</option>
            <option value="5">5. Liam Garcia</option>
          </select>
        </div>

        <div>
          <label class="guestbook-field-label" for="noteAuthorInput">Your Name or Alias:</label>
          <input class="guestbook-input" type="text" id="noteAuthorInput" placeholder="e.g. Professor X or Code Reviewer" maxlength="40" style="margin-top:4px;">
        </div>

        <div>
          <label class="guestbook-field-label" for="noteTextInput">Your Note (Max 120 chars):</label>
          <textarea class="guestbook-textarea" id="noteTextInput" rows="3" maxlength="120" placeholder="Type a friendly comment, joke, or review..." required style="margin-top:4px;"></textarea>
          <div class="char-counter" id="charCounter">0 / 120</div>
        </div>

        <button class="guestbook-submit-btn" type="submit">
          <svg class="uicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          Stick Note to Desk
        </button>
      </form>
    </div>
  </div>

  <!-- 5. ROOT CONTAINER FOR CLEAR-BOOK OVERLAY -->
  <div id="bookOverlayRoot"></div>

  <!-- 6. VENDORED OFFLINE LIBRARIES -->
  <script src="js/lib/three.min.js"></script>
  <script src="js/lib/gsap.min.js"></script>

  <!-- 7. APPLICATION MODULES -->
  <script src="js/api.js"></script>
  <script src="js/humor.js"></script>
  <script src="js/book.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
